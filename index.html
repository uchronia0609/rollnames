<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>随机名字生成器</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f9f3e8 0%, #ffe8d6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            padding: 16px;
            margin: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            display: flex;
            gap: 16px;
            align-items: stretch;
            height: 90vh;
            max-height: 720px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 18px 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .left-panel {
            flex: 1;
            gap: 8px;
            justify-content: flex-start;
            padding-top: 8px;
        }

        .left-panel .section-label {
            font-size: 0.85rem;
            color: #ab8c78;
            letter-spacing: 3px;
            margin-bottom: 2px;
        }

        .style-select-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
        }

        .style-select-row select {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e8ddd0;
            border-radius: 30px;
            font-size: 0.95rem;
            background: white;
            outline: none;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            color: #3e2c1f;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .style-select-row select:focus {
            border-color: #e07a3f;
        }

        .style-select-row .style-hint {
            font-size: 0.6rem;
            color: #b8a08a;
            white-space: nowrap;
            min-width: 60px;
            text-align: right;
        }

        .mode-group {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 50px;
            padding: 8px 0;
            border: 2px solid #e8ddd0;
            border-radius: 30px;
            background: transparent;
            color: #7a6556;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            letter-spacing: 1px;
            text-align: center;
        }

        .mode-btn:hover {
            border-color: #c9b8a8;
            background: rgba(255, 255, 255, 0.4);
        }

        .mode-btn.active {
            border-color: #e07a3f;
            background: #e07a3f;
            color: white;
            box-shadow: 0 4px 12px rgba(224, 122, 63, 0.3);
        }

        .mode-btn.active:hover {
            background: #d06a2f;
        }

        .mode-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .fixed-section {
            transition: opacity 0.25s ease, max-height 0.25s ease;
            overflow: hidden;
        }

        .fixed-section.hidden {
            opacity: 0;
            max-height: 0;
            margin: 0;
            padding: 0;
            pointer-events: none;
        }

        .fixed-section .section-label {
            font-size: 0.85rem;
            color: #ab8c78;
            letter-spacing: 3px;
            margin-bottom: 2px;
        }

        .fixed-surname-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 2px;
        }

        .fixed-surname-row input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e8ddd0;
            border-radius: 30px;
            font-size: 0.95rem;
            background: white;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            text-align: center;
            letter-spacing: 1px;
            max-width: 110px;
        }

        .fixed-surname-row input:focus {
            border-color: #e07a3f;
        }

        .fixed-surname-row input::placeholder {
            color: #ccc;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .fixed-surname-row .confirm-btn {
            background: #e07a3f;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            transition: all 0.12s;
            white-space: nowrap;
            font-weight: 600;
        }

        .fixed-surname-row .confirm-btn:hover {
            background: #c96932;
        }

        .fixed-surname-row .confirm-btn:active {
            transform: scale(0.95);
        }

        .fixed-surname-row .clear-btn {
            background: #e8ddd0;
            border: none;
            color: #7a6556;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            transition: all 0.12s;
            white-space: nowrap;
        }

        .fixed-surname-row .clear-btn:hover {
            background: #d5c8b8;
        }

        .fixed-status {
            font-size: 0.75rem;
            color: #b8a08a;
            min-height: 18px;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .fixed-status.active {
            color: #e07a3f;
        }

        .fixed-char-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 2px;
            flex-wrap: wrap;
        }

        .fixed-char-row input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e8ddd0;
            border-radius: 30px;
            font-size: 0.95rem;
            background: white;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            text-align: center;
            letter-spacing: 1px;
            max-width: 60px;
        }

        .fixed-char-row input:focus {
            border-color: #e07a3f;
        }

        .fixed-char-row input::placeholder {
            color: #ccc;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .fixed-char-row select {
            padding: 6px 8px;
            border: 2px solid #e8ddd0;
            border-radius: 30px;
            font-size: 0.8rem;
            background: white;
            outline: none;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            color: #5a4a3a;
            cursor: pointer;
        }

        .fixed-char-row select:focus {
            border-color: #e07a3f;
        }

        .fixed-char-row .confirm-btn {
            background: #4a8a7a;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            transition: all 0.12s;
            white-space: nowrap;
            font-weight: 600;
        }

        .fixed-char-row .confirm-btn:hover {
            background: #3a7a6a;
        }

        .fixed-char-row .confirm-btn:active {
            transform: scale(0.95);
        }

        .fixed-char-row .clear-btn {
            background: #e8ddd0;
            border: none;
            color: #7a6556;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            transition: all 0.12s;
            white-space: nowrap;
        }

        .fixed-char-row .clear-btn:hover {
            background: #d5c8b8;
        }

        .fixed-char-status {
            font-size: 0.75rem;
            color: #b8a08a;
            min-height: 18px;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .fixed-char-status.active {
            color: #4a8a7a;
        }

        .btn-gen {
            background: #e07a3f;
            border: none;
            color: white;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 1px;
            padding: 12px 0;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 12px 20px -10px #c15f2a, 0 4px 0 #8f421a;
            transition: all 0.12s ease;
            border: 2px solid #ffc9a3;
            width: 100%;
            text-align: center;
        }

        .btn-gen:active {
            transform: translateY(4px);
            box-shadow: 0 6px 12px -6px #b9552a, 0 2px 0 #7a3517;
        }

        .btn-gen:hover {
            background: #e9894f;
        }

        .btn-gen .icon {
            font-size: 1.1rem;
            display: block;
            margin-bottom: 1px;
        }
        .btn-gen .count-label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .status-hint {
            font-size: 0.75rem;
            color: #b8a08a;
            text-align: center;
            letter-spacing: 1px;
            margin-top: -2px;
            min-height: 20px;
        }

        .center-panel {
            flex: 1;
        }

        .result-box {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 4px 4px;
        }

        .result-box::-webkit-scrollbar {
            width: 5px;
        }
        .result-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .result-box::-webkit-scrollbar-thumb {
            background: #d5c8b8;
            border-radius: 10px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0e8e0;
            flex-shrink: 0;
        }

        .result-header .title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #5a4a3a;
            letter-spacing: 2px;
        }

        .result-header .badge {
            background: #e8ddd0;
            padding: 2px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #5a4a3a;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
        }

        .result-item {
            background: white;
            padding: 8px 10px;
            border-radius: 12px;
            border: 1px solid #f0e8e0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: all 0.12s;
            text-align: center;
        }

        .result-item:hover {
            transform: scale(1.02);
            border-color: #e07a3f;
        }

        .result-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #3e2c1f;
            letter-spacing: 3px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .result-lineage {
            font-size: 0.6rem;
            color: #8a7a6a;
            margin-top: 3px;
            letter-spacing: 0.5px;
            border-top: 1px dashed #f0e8e0;
            padding-top: 3px;
        }

        .result-empty {
            color: #b8a08a;
            font-size: 0.9rem;
            text-align: center;
            padding: 50px 0;
            letter-spacing: 2px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .right-panel {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            transition: opacity 0.3s ease;
        }

        .right-panel.hidden {
            opacity: 0.3;
            pointer-events: none;
        }

        .right-panel::-webkit-scrollbar {
            width: 4px;
        }
        .right-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .right-panel::-webkit-scrollbar-thumb {
            background: #d5c8b8;
            border-radius: 10px;
        }

        .right-panel .panel-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #5a4a3a;
            letter-spacing: 2px;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #f0e8e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .right-panel .panel-title .close-toggle {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: #b8a08a;
            padding: 0 6px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .right-panel .panel-title .close-toggle:hover {
            color: #d45a3a;
        }

        .lib-section {
            margin-bottom: 14px;
        }

        .lib-section:last-child {
            margin-bottom: 0;
        }

        .lib-section .lib-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #7a6556;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .lib-section .lib-label .count {
            background: #e8ddd0;
            padding: 0 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: #5a4a3a;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 4px;
            max-height: 68px;
            overflow-y: auto;
            padding: 2px 0;
        }

        .tag-list::-webkit-scrollbar {
            width: 3px;
        }
        .tag-list::-webkit-scrollbar-thumb {
            background: #d5c8b8;
            border-radius: 10px;
        }

        .tag {
            background: #f5ede6;
            padding: 2px 8px 2px 10px;
            border-radius: 14px;
            font-size: 0.82rem;
            color: #3e2c1f;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            border: 1px solid #e8ddd0;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .tag .del-btn {
            background: none;
            border: none;
            color: #b8a08a;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0 2px;
            border-radius: 50%;
            line-height: 1;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .tag .del-btn:hover {
            color: #d45a3a;
        }

        .add-row-sm {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .add-row-sm input {
            flex: 1;
            padding: 4px 10px;
            border: 1.5px solid #e8ddd0;
            border-radius: 18px;
            font-size: 0.82rem;
            background: white;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            min-width: 0;
            width: 56px;
        }

        .add-row-sm input:focus {
            border-color: #e07a3f;
        }

        .add-row-sm button {
            background: #e07a3f;
            border: none;
            color: white;
            padding: 4px 14px;
            border-radius: 18px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.12s;
            font-weight: 600;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            white-space: nowrap;
        }

        .add-row-sm button:hover {
            background: #c96932;
        }

        .add-row-sm button:active {
            transform: scale(0.95);
        }

        .lib-hint {
            font-size: 0.65rem;
            color: #b8a08a;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .lib-reset {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #f0e8e0;
            text-align: center;
        }

        .lib-reset button {
            background: #e8ddd0;
            border: none;
            color: #5a4a3a;
            padding: 4px 16px;
            border-radius: 18px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.12s;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .lib-reset button:hover {
            background: #f0d0c8;
            color: #b8452a;
        }

        .right-panel .panel-hint {
            font-size: 0.7rem;
            color: #b8a08a;
            text-align: center;
            padding: 20px 0;
            letter-spacing: 1px;
            display: none;
        }

        .right-panel .panel-hint.show {
            display: block;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                height: auto;
                max-height: none;
                gap: 12px;
            }
            .panel {
                max-height: none;
                padding: 14px 12px;
            }
            .left-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: 6px;
                padding: 10px 12px;
            }
            .left-panel .section-label {
                display: none;
            }
            .style-select-row {
                flex: 1;
                min-width: 140px;
            }
            .style-select-row select {
                font-size: 0.8rem;
                padding: 6px 10px;
            }
            .style-select-row .style-hint {
                display: none;
            }
            .fixed-surname-row input {
                max-width: 80px;
                padding: 6px 8px;
                font-size: 0.85rem;
            }
            .fixed-char-row input {
                max-width: 50px;
                padding: 6px 8px;
                font-size: 0.85rem;
            }
            .fixed-char-row select {
                font-size: 0.7rem;
                padding: 5px 6px;
            }
            .mode-group {
                flex: 1;
                min-width: 160px;
            }
            .mode-btn {
                font-size: 0.75rem;
                padding: 6px 0;
                min-width: 40px;
            }
            .btn-gen {
                max-width: 100px;
                padding: 8px 0;
                font-size: 0.9rem;
            }
            .btn-gen .icon {
                font-size: 0.9rem;
            }
            .right-panel {
                max-height: 340px;
            }
            .result-box {
                max-height: 400px;
            }
            .result-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            }
            .result-item {
                padding: 6px 8px;
            }
            .result-name {
                font-size: 0.95rem;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .panel {
                padding: 10px 8px;
                border-radius: 18px;
            }
            .left-panel {
                gap: 4px;
                padding: 8px 6px;
            }
            .style-select-row select {
                font-size: 0.7rem;
                padding: 5px 8px;
            }
            .fixed-surname-row input {
                max-width: 60px;
                padding: 4px 6px;
                font-size: 0.8rem;
            }
            .fixed-surname-row .confirm-btn {
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            .fixed-surname-row .clear-btn {
                padding: 4px 8px;
                font-size: 0.65rem;
            }
            .fixed-char-row input {
                max-width: 40px;
                padding: 4px 6px;
                font-size: 0.8rem;
            }
            .fixed-char-row select {
                font-size: 0.6rem;
                padding: 4px 4px;
                max-width: 60px;
            }
            .fixed-char-row .confirm-btn {
                padding: 4px 8px;
                font-size: 0.65rem;
            }
            .fixed-char-row .clear-btn {
                padding: 4px 6px;
                font-size: 0.6rem;
            }
            .mode-btn {
                font-size: 0.65rem;
                padding: 4px 0;
                min-width: 32px;
            }
            .btn-gen {
                max-width: 70px;
                padding: 6px 0;
                font-size: 0.75rem;
            }
            .btn-gen .icon {
                font-size: 0.7rem;
            }
            .right-panel {
                max-height: 260px;
                padding: 10px 8px;
            }
            .result-box {
                max-height: 300px;
                padding: 2px 4px;
            }
            .result-grid {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 4px;
            }
            .result-item {
                padding: 4px 6px;
            }
            .result-name {
                font-size: 0.85rem;
                letter-spacing: 1px;
            }
            .result-lineage {
                font-size: 0.5rem;
            }
            .result-header .title {
                font-size: 0.7rem;
            }
            .result-header .badge {
                font-size: 0.6rem;
                padding: 1px 10px;
            }
            .tag {
                font-size: 0.7rem;
                padding: 1px 6px 1px 8px;
            }
            .add-row-sm input {
                font-size: 0.7rem;
                padding: 3px 6px;
                width: 36px;
            }
            .add-row-sm button {
                font-size: 0.65rem;
                padding: 3px 8px;
            }
            .lib-section {
                margin-bottom: 8px;
            }
            .lib-section .lib-label {
                font-size: 0.7rem;
            }
            .tag-list {
                max-height: 48px;
            }
            .status-hint {
                font-size: 0.6rem;
                min-height: 16px;
            }
            .fixed-status {
                font-size: 0.6rem;
            }
            .fixed-char-status {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== 左栏 ===== -->
        <div class="panel left-panel">
            <div class="section-label">风 格</div>
            <div class="style-select-row">
                <select id="styleSelect">
                    <option value="general">通用</option>
                    <option value="ming">明朝宗室</option>
                    <option value="sanguo">三国两晋</option>
                    <option value="gufeng">古风女性</option>
                </select>

            if (data.gufengFixedNames.length === 0) {
                const second = secondPool[Math.floor(Math.random() * secondPool.length)];
                const third = thirdPool[Math.floor(Math.random() * thirdPool.length)];
                return applyFixedChar(surname, second, third);
            }
            const fixedName = data.gufengFixedNames[Math.floor(Math.random() * data.gufengFixedNames.length)];
            const second = fixedName[0];
            const third = fixedName[1];
            return applyFixedChar(surname, second, third);
        }

        // ============================================================
        //  主生成入口
        // ============================================================
        function generateName() {
            if (currentStyle === 'ming') {
                return generateMingName();
            } else if (currentStyle === 'sanguo') {
                return generateSanGuoName();
            } else if (currentStyle === 'gufeng') {
                return generateGuFengName();
            } else {
                // 通用模式
                if (currentMode === 'single') {
                    const surname = getWeightedSurname();
                    const allChars = data.secondChars.concat(data.thirdChars);
                    return surname + getRandomElement(allChars);
                } else if (currentMode === 'double') {
                    const surname = getWeightedSurname();
                    const second = getRandomElement(data.secondChars);
                    const third = getRandomElement(data.thirdChars);
                    return applyFixedChar(surname, second, third);
                } else {
                    // random: 70% 双字, 20% 固定搭配, 10% 单字
                    const roll = getRandomInt(1, 100);
                    if (roll <= 70) {
                        const surname = getWeightedSurname();
                        const second = getRandomElement(data.secondChars);
                        const third = getRandomElement(data.thirdChars);
                        return applyFixedChar(surname, second, third);
                    } else if (roll <= 90) {
                        const surname = getWeightedSurname();
                        if (data.fixedNames.length === 0) {
                            const second = getRandomElement(data.secondChars);
                            const third = getRandomElement(data.thirdChars);
                            return applyFixedChar(surname, second, third);
                        }
                        const fixedName = getRandomElement(data.fixedNames);
                        const second = fixedName[0];
                        const third = fixedName[1];
                        return applyFixedChar(surname, second, third);
                    } else {
                        const surname = getWeightedSurname();
                        const allChars = data.secondChars.concat(data.thirdChars);
                        return surname + getRandomElement(allChars);
                    }
                }
            }
        }

        function generateBatch(count) {
            const names = [];
            for (let i = 0; i < count; i++) {
                names.push(generateName());
            }
            return names;
        }

        // ============================================================
        //  UI 渲染
        // ============================================================
        const resultGrid = document.getElementById('resultGrid');
        const resultBadge = document.getElementById('resultBadge');

        const surnameContainer = document.getElementById('surnameContainer');
        const secondContainer = document.getElementById('secondContainer');
        const thirdContainer = document.getElementById('thirdContainer');
        const fixedContainer = document.getElementById('fixedContainer');

        const surnameCount = document.getElementById('surnameCount');
        const secondCount = document.getElementById('secondCount');
        const thirdCount = document.getElementById('thirdCount');
        const fixedCount = document.getElementById('fixedCount');

        const surnameInput = document.getElementById('surnameInput');
        const secondInput = document.getElementById('secondInput');
        const thirdInput = document.getElementById('thirdInput');
        const fixedInput = document.getElementById('fixedInput');

        const libToggle = document.getElementById('libToggle');
        const libPanel = document.getElementById('libPanel');
        const panelHint = document.getElementById('panelHint');

        const fixedSurnameInput = document.getElementById('fixedSurnameInput');
        const confirmSurnameBtn = document.getElementById('confirmSurnameBtn');
        const clearSurnameBtn = document.getElementById('clearSurnameBtn');
        const fixedStatus = document.getElementById('fixedStatus');

        const fixedCharInput = document.getElementById('fixedCharInput');
        const fixedCharPositionSelect = document.getElementById('fixedCharPosition');
        const confirmCharBtn = document.getElementById('confirmCharBtn');
        const clearCharBtn = document.getElementById('clearCharBtn');
        const fixedCharStatus = document.getElementById('fixedCharStatus');

        const statusHint = document.getElementById('statusHint');
        const styleSelect = document.getElementById('styleSelect');
        const styleHint = document.getElementById('styleHint');
        const fixedSection = document.getElementById('fixedSection');
        const modeGroup = document.getElementById('modeGroup');
        const modeLabel = document.getElementById('modeLabel');

        function renderAll() {
            const isGuFeng = currentStyle === 'gufeng';

            if (isGuFeng) {
                // 古风女性模式：显示古风字库（可编辑）
                renderTags(surnameContainer, data.gufengSurnames, 'gufeng_surname');
                renderTags(secondContainer, data.gufengSecondChars, 'gufeng_second');
                renderTags(thirdContainer, data.gufengThirdChars, 'gufeng_third');
                renderTags(fixedContainer, data.gufengFixedNames, 'gufeng_fixed');

                surnameCount.textContent = data.gufengSurnames.length;
                secondCount.textContent = data.gufengSecondChars.length;
                thirdCount.textContent = data.gufengThirdChars.length;
                fixedCount.textContent = data.gufengFixedNames.length;
            } else {
                // 其他模式：显示通用字库
                renderTags(surnameContainer, data.surnames, 'surname');
                renderTags(secondContainer, data.secondChars, 'second');
                renderTags(thirdContainer, data.thirdChars, 'third');
                renderTags(fixedContainer, data.fixedNames, 'fixed');

                surnameCount.textContent = data.surnames.length;
                secondCount.textContent = data.secondChars.length;
                thirdCount.textContent = data.thirdChars.length;
                fixedCount.textContent = data.fixedNames.length;
            }

            saveData();
            updateUI();
        }

        function renderTags(container, items, type) {
            if (!items || items.length === 0) {
                container.innerHTML = '<span style="color:#b8a08a;font-size:0.7rem;">（空）</span>';
                return;
            }
            container.innerHTML = items.map((item, index) => {
                return `<span class="tag">
                    ${item}
                    <button class="del-btn" onclick="deleteItem('${type}', ${index})">✕</button>
                </span>`;
            }).join('');
        }

        function updateUI() {
            const isMing = currentStyle === 'ming';
            const isSanGuo = currentStyle === 'sanguo';
            const isGuFeng = currentStyle === 'gufeng';

            if (isMing) {
                styleHint.textContent = '🫅 朱氏皇室';
                fixedSection.classList.add('hidden');
                modeGroup.querySelectorAll('.mode-btn').forEach(btn => btn.classList.add('disabled'));
                modeLabel.textContent = '模 式（明朝宗室下固定三字名）';
                libPanel.classList.add('hidden');
                panelHint.classList.add('show');
                panelHint.textContent = '🫅 明朝宗室风格下字库管理不可用';
            } else if (isSanGuo) {
                styleHint.textContent = '⚔️ 三国两晋';
                fixedSection.classList.add('hidden');
                modeGroup.querySelectorAll('.mode-btn').forEach(btn => btn.classList.add('disabled'));
                modeLabel.textContent = '模 式（三国两晋下固定格式）';
                libPanel.classList.add('hidden');
                panelHint.classList.add('show');
                panelHint.textContent = '⚔️ 三国两晋风格下字库管理不可用';
            } else if (isGuFeng) {
                styleHint.textContent = '🌸 古风女性';
                fixedSection.classList.remove('hidden');
                modeGroup.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('disabled'));
                modeLabel.textContent = '模 式';
                libPanel.classList.remove('hidden');
                panelHint.classList.remove('show');
            } else {
                styleHint.textContent = '自由组合';
                fixedSection.classList.remove('hidden');
                modeGroup.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('disabled'));
                modeLabel.textContent = '模 式';
                libPanel.classList.remove('hidden');
                panelHint.classList.remove('show');
            }

            updateStatusHint();
        }

        function updateStatusHint() {
            const isMing = currentStyle === 'ming';
            const isSanGuo = currentStyle === 'sanguo';
            const isGuFeng = currentStyle === 'gufeng';

            if (isMing) {
                statusHint.textContent = '明朝宗室：固定朱姓，字辈+五行尾字';
                fixedStatus.textContent = '（明朝宗室风格下固定为朱姓）';
                fixedStatus.className = 'fixed-status';
                fixedCharStatus.textContent = '（明朝宗室风格下由字辈决定）';
                fixedCharStatus.className = 'fixed-char-status';
                return;
            }

            if (isSanGuo) {
                statusHint.textContent = '三国两晋：姓氏 + 名（带权重）';
                fixedStatus.textContent = '（三国两晋风格下固定姓氏不可用）';
                fixedStatus.className = 'fixed-status';
                fixedCharStatus.textContent = '（三国两晋风格下固定字不可用）';
                fixedCharStatus.className = 'fixed-char-status';
                return;
            }

            if (isGuFeng) {
                const modeMap = {
                    'single': '单字名',
                    'double': '双字名',
                    'random': '随机'
                };
                let hint = '当前模式：' + (modeMap[currentMode] || '随机');
                if (fixedSurname) {
                    hint += ' | 固定姓氏：' + fixedSurname;
                }
                if (fixedChar) {
                    const posMap = { 'middle': '中间字', 'end': '末尾字' };
                    hint += ' | 固定' + posMap[fixedCharPosition] + '：' + fixedChar;
                }
                statusHint.textContent = hint;
                fixedStatus.textContent = fixedSurname ? '✅ 已固定：' + fixedSurname : '未设置固定姓氏';
                fixedStatus.className = fixedSurname ? 'fixed-status active' : 'fixed-status';
                fixedCharStatus.textContent = fixedChar ? '✅ 已固定' + (fixedCharPosition === 'middle' ? '中间字' : '末尾字') + '：' + fixedChar : '未设置固定字';
                fixedCharStatus.className = fixedChar ? 'fixed-char-status active' : 'fixed-char-status';
                return;
            }

            const modeMap = {
                'single': '单字名',
                'double': '双字名',
                'random': '随机'
            };
            let hint = '当前模式：' + (modeMap[currentMode] || '随机');
            if (fixedSurname) {
                hint += ' | 固定姓氏：' + fixedSurname;
            }
            if (fixedChar) {
                const posMap = { 'middle': '中间字', 'end': '末尾字' };
                hint += ' | 固定' + posMap[fixedCharPosition] + '：' + fixedChar;
            }
            statusHint.textContent = hint;

            if (fixedSurname) {
                fixedStatus.textContent = '✅ 已固定：' + fixedSurname;
                fixedStatus.className = 'fixed-status active';
            } else {
                fixedStatus.textContent = '未设置固定姓氏';
                fixedStatus.className = 'fixed-status';
            }

            if (fixedChar) {
                const posMap = { 'middle': '中间字', 'end': '末尾字' };
                fixedCharStatus.textContent = '✅ 已固定' + posMap[fixedCharPosition] + '：' + fixedChar;
                fixedCharStatus.className = 'fixed-char-status active';
            } else {
                fixedCharStatus.textContent = '未设置固定字';
                fixedCharStatus.className = 'fixed-char-status';
            }
        }

        // ============================================================
        //  显示结果
        // ============================================================
        function showResults(items) {
            if (!items || items.length === 0) {
                resultGrid.innerHTML = '<div class="result-empty">点击左侧按钮生成名字</div>';
                resultBadge.textContent = '0 个';
                return;
            }

            const isMingResult = items[0] && typeof items[0] === 'object' && items[0].name !== undefined && items[0].branch !== undefined;

            if (isMingResult) {
                const showLineage = items.length <= 10;
                resultGrid.innerHTML = items.map(function(item) {
                    let html = '<div class="result-item">';
                    html += '<div class="result-name">' + item.name + '</div>';
                    if (showLineage) {
                        const lineage = getLineageText(item);
                        html += '<div class="result-lineage">' + item.branch + '后裔，' + lineage + '</div>';
                    }
                    html += '</div>';
                    return html;
                }).join('');
            } else {
                resultGrid.innerHTML = items.map(function(name) {
                    return '<div class="result-item"><div class="result-name">' + name + '</div></div>';
                }).join('');
            }

            resultBadge.textContent = items.length + ' 个';
        }

        function generateAndShow(count) {
            const results = generateBatch(count);
            showResults(results);
        }

        // ============================================================
        //  增删操作
        // ============================================================
        function deleteItem(type, index) {
            const isGuFeng = type.startsWith('gufeng_');
            const keyMap = {
                'surname': 'surnames',
                'second': 'secondChars',
                'third': 'thirdChars',
                'fixed': 'fixedNames',
                'gufeng_surname': 'gufengSurnames',
                'gufeng_second': 'gufengSecondChars',
                'gufeng_third': 'gufengThirdChars',
                'gufeng_fixed': 'gufengFixedNames'
            };
            const key = keyMap[type];
            if (!key) return;
            data[key].splice(index, 1);
            renderAll();
        }

        function addSurname() {
            const isGuFeng = currentStyle === 'gufeng';
            const pool = isGuFeng ? data.gufengSurnames : data.surnames;
            const val = surnameInput.value.trim();
            if (!val) return alert('请输入姓氏');
            if (val.length > 1) return alert('姓氏只能输入一个字');
            if (pool.includes(val)) return alert('该姓氏已存在');
            pool.push(val);
            surnameInput.value = '';
            renderAll();
        }

        function addSecond() {
            const isGuFeng = currentStyle === 'gufeng';
            const pool = isGuFeng ? data.gufengSecondChars : data.secondChars;
            const val = secondInput.value.trim();
            if (!val) return alert('请输入一个字');
            if (val.length > 1) return alert('只能输入一个字');
            if (pool.includes(val)) return alert('该字已存在');
            pool.push(val);
            secondInput.value = '';
            renderAll();
        }

        function addThird() {
            const isGuFeng = currentStyle === 'gufeng';
            const pool = isGuFeng ? data.gufengThirdChars : data.thirdChars;
            const val = thirdInput.value.trim();
            if (!val) return alert('请输入一个字');
            if (val.length > 1) return alert('只能输入一个字');
            if (pool.includes(val)) return alert('该字已存在');
            pool.push(val);
            thirdInput.value = '';
            renderAll();
        }

        function addFixed() {
            const isGuFeng = currentStyle === 'gufeng';
            const pool = isGuFeng ? data.gufengFixedNames : data.fixedNames;
            const val = fixedInput.value.trim();
            if (!val) return alert('请输入二字名');
            if (val.length !== 2) return alert('固定搭配必须是两个字');
            if (pool.includes(val)) return alert('该搭配已存在');
            pool.push(val);
            fixedInput.value = '';
            renderAll();
        }

        window.addSurname = addSurname;
        window.addSecond = addSecond;
        window.addThird = addThird;
        window.addFixed = addFixed;
        window.deleteItem = deleteItem;

        surnameInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') addSurname(); });
        secondInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') addSecond(); });
        thirdInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') addThird(); });
        fixedInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') addFixed(); });

        // ============================================================
        //  固定姓氏
        // ============================================================
        function confirmSurname() {
            if (currentStyle === 'ming' || currentStyle === 'sanguo') {
                alert('当前风格下不支持固定姓氏');
                return;
            }
            const val = fixedSurnameInput.value.trim();
            if (!val) {
                alert('请先输入姓氏');
                return;
            }
            if (val.length > 5) {
                alert('姓氏最多5个字');
                return;
            }
            fixedSurname = val;
            updateStatusHint();
        }

        confirmSurnameBtn.addEventListener('click', confirmSurname);

        fixedSurnameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmSurname();
            }
        });

        clearSurnameBtn.addEventListener('click', function() {
            fixedSurnameInput.value = '';
            fixedSurname = '';
            updateStatusHint();
        });

        // ============================================================
        //  固定字
        // ============================================================
        function confirmChar() {
            if (currentStyle === 'ming' || currentStyle === 'sanguo') {
                alert('当前风格下不支持固定字');
                return;
            }
            const val = fixedCharInput.value.trim();
            if (!val) {
                alert('请先输入一个字');
                return;
            }
            if (val.length > 1) {
                alert('只能输入一个字');
                return;
            }
            fixedChar = val;
            fixedCharPosition = fixedCharPositionSelect.value;
            updateStatusHint();
        }

        confirmCharBtn.addEventListener('click', confirmChar);

        fixedCharInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmChar();
            }
        });

        fixedCharPositionSelect.addEventListener('change', function() {
            if (fixedChar) {
                fixedCharPosition = this.value;
                updateStatusHint();
            }
        });

        clearCharBtn.addEventListener('click', function() {
            fixedCharInput.value = '';
            fixedChar = '';
            updateStatusHint();
        });

        // ============================================================
        //  风格切换
        // ============================================================
        styleSelect.addEventListener('change', function() {
            currentStyle = this.value;
            if (currentStyle === 'ming' || currentStyle === 'sanguo') {
                fixedSurname = '';
                fixedSurnameInput.value = '';
                fixedChar = '';
                fixedCharInput.value = '';
            }
            renderAll();
            generateAndShow(1);
        });

        // ============================================================
        //  模式切换
        // ============================================================
        document.querySelectorAll('.mode-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                if (this.classList.contains('disabled')) return;
                document.querySelectorAll('.mode-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                this.classList.add('active');
                currentMode = this.dataset.mode;
                updateStatusHint();
            });
        });

        // ============================================================
        //  重置
        // ============================================================
        function resetAll() {
            if (!confirm('确定要恢复所有字库到默认状态吗？（当前数据将丢失）')) return;
            data = {
                surnames: [...DEFAULT_DATA.surnames],
                secondChars: [...DEFAULT_DATA.secondChars],
                thirdChars: [...DEFAULT_DATA.thirdChars],
                fixedNames: [...DEFAULT_DATA.fixedNames],
                gufengSurnames: [...DEFAULT_DATA.gufengSurnames],
                gufengSecondChars: [...DEFAULT_DATA.gufengSecondChars],
                gufengThirdChars: [...DEFAULT_DATA.gufengThirdChars],
                gufengFixedNames: [...DEFAULT_DATA.gufengFixedNames]
            };
            renderAll();
            fixedSurname = '';
            fixedSurnameInput.value = '';
            fixedChar = '';
            fixedCharInput.value = '';
            updateStatusHint();
        }
        window.resetAll = resetAll;

        // ============================================================
        //  字库面板折叠
        // ============================================================
        let libOpen = true;
        libToggle.addEventListener('click', function() {
            libOpen = !libOpen;
            const sections = libPanel.querySelectorAll('.lib-section, .lib-reset');
            sections.forEach(function(el) {
                el.style.display = libOpen ? '' : 'none';
            });
            libToggle.textContent = libOpen ? '▾' : '▸';
        });

        // ============================================================
        //  按钮事件
        // ============================================================
        document.getElementById('btnGen1').addEventListener('click', function() {
            generateAndShow(1);
        });
        document.getElementById('btnGen10').addEventListener('click', function() {
            generateAndShow(10);
        });
        document.getElementById('btnGen50').addEventListener('click', function() {
            generateAndShow(50);
        });

        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.key === 'Enter') {
                if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
                e.preventDefault();
                generateAndShow(1);
            }
        });

        // ============================================================
        //  初始化
        // ============================================================
        renderAll();
        showResults([]);

        console.log('✅ 字库管理已加载！');
        console.log('✅ 通用模式已就绪，明朝宗室模式已就绪，三国两晋模式已就绪，古风女性模式已就绪！');
        console.log('✅ 古风女性模式：字库可编辑，单字:双字:固定搭配 = 1:7:2');
        console.log('✅ 切换风格下拉菜单体验不同生成逻辑。');
    </script>
</body>
</html>
